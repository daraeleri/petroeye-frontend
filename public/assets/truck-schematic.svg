<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" id="petrotwin-truck-schematic">
  <!--
    Top-down petrol tanker truck schematic.
    Pure geometric shapes, no photographic/licensed assets — matches
    docs/ui-context.md's "legibility over fidelity" direction.

    Colors use currentColor / CSS vars where practical so it can be
    recolored per truck status without editing the file.

    Hotspot groups (id="hotspot-*") mark where the frontend should
    position live sensor badges (fuel, temp, tilt, hatch, gps) — read
    their cx/cy via JS/getBBox() rather than hardcoding pixel offsets
    in component code, so this file stays the single source of truth
    for hotspot placement.
  -->

  <!-- Cab -->
  <g id="truck-cab">
    <rect x="10" y="55" width="55" height="70" rx="6"
          fill="var(--bg-surface, #1E293B)" stroke="var(--border-default, #2A333D)" stroke-width="2"/>
    <rect x="18" y="65" width="39" height="20" rx="3"
          fill="none" stroke="var(--accent-info, #38BDF8)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Chassis connector -->
  <rect x="65" y="80" width="20" height="20" fill="var(--border-default, #2A333D)"/>

  <!-- Tank body -->
  <g id="truck-tank">
    <rect x="85" y="45" width="300" height="90" rx="45"
          fill="var(--bg-surface, #1E293B)" stroke="var(--border-default, #2A333D)" stroke-width="2"/>
    <!-- Tank ribbing (visual detail only, purely decorative) -->
    <line x1="130" y1="45" x2="130" y2="135" stroke="var(--border-default, #2A333D)" stroke-width="1" opacity="0.5"/>
    <line x1="180" y1="45" x2="180" y2="135" stroke="var(--border-default, #2A333D)" stroke-width="1" opacity="0.5"/>
    <line x1="230" y1="45" x2="230" y2="135" stroke="var(--border-default, #2A333D)" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="45" x2="280" y2="135" stroke="var(--border-default, #2A333D)" stroke-width="1" opacity="0.5"/>
    <line x1="330" y1="45" x2="330" y2="135" stroke="var(--border-default, #2A333D)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Wheels (both sides) -->
  <g id="truck-wheels" fill="#0B0F14" stroke="var(--border-default, #2A333D)" stroke-width="1.5">
    <rect x="20" y="40" width="8" height="20" rx="2"/>
    <rect x="20" y="120" width="8" height="20" rx="2"/>
    <rect x="110" y="40" width="8" height="20" rx="2"/>
    <rect x="110" y="120" width="8" height="20" rx="2"/>
    <rect x="200" y="40" width="8" height="20" rx="2"/>
    <rect x="200" y="120" width="8" height="20" rx="2"/>
    <rect x="290" y="40" width="8" height="20" rx="2"/>
    <rect x="290" y="120" width="8" height="20" rx="2"/>
    <rect x="360" y="40" width="8" height="20" rx="2"/>
    <rect x="360" y="120" width="8" height="20" rx="2"/>
  </g>

  <!-- Hotspot anchors: circles at r=3, invisible fill, used purely as
       coordinate references for overlaying live badges via JS -->
  <g id="hotspots" fill="transparent">
    <circle id="hotspot-fuel" cx="140" cy="90" r="3"/>
    <circle id="hotspot-temp" cx="235" cy="90" r="3"/>
    <circle id="hotspot-hatch" cx="335" cy="60" r="3"/>
    <circle id="hotspot-tilt" cx="38" cy="90" r="3"/>
    <circle id="hotspot-gps" cx="385" cy="90" r="3"/>
  </g>
</svg>
